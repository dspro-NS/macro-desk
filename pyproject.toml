[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-desk"
version = "0.1.0"
description = "Personal India macro and RBI intelligence system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.52.4,<0.53",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "httpx>=0.28.1,<0.29",
]

[project.scripts]
macro-desk = "macro_desk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
